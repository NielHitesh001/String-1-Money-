services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      CORPGRAPH_ENV: production
      CORPGRAPH_API_KEY: "${CORPGRAPH_API_KEY:?set CORPGRAPH_API_KEY to at least 32 characters}"
      CORPGRAPH_RATE_LIMIT_PER_MINUTE: "${CORPGRAPH_RATE_LIMIT_PER_MINUTE:-120}"
      CORPGRAPH_CORS_ORIGINS: "${CORPGRAPH_CORS_ORIGINS:-http://127.0.0.1:8080}"
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:?set NEO4J_PASSWORD}"
      NEO4J_DATABASE: neo4j
      REDIS_URL: redis://redis:6379
    depends_on:
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      CORPGRAPH_API_KEY: "${CORPGRAPH_API_KEY:?set CORPGRAPH_API_KEY}"
      CORPGRAPH_SITE_ADDRESS: "${CORPGRAPH_SITE_ADDRESS:-:8080}"
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${CORPGRAPH_PORT:-8080}:8080"

