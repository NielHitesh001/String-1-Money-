[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "corpgraph"
version = "0.1.0"
description = "Open-source corporate relationship intelligence pipeline"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "neo4j>=5.25,<6",
  "pydantic>=2.9,<3",
  "PyYAML>=6.0,<7",
  "rapidfuzz>=3.10,<4",
  "redis>=5.2,<6",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "pytest-cov>=5,<7",
  "ruff>=0.7,<1",
  "types-PyYAML>=6.0,<7",
]

[project.scripts]
corpgraph-sec = "corpgraph.scrapers.sec_edgar:main"
corpgraph-load = "corpgraph.graph_db.bulk_loader:main"
corpgraph-resolve = "corpgraph.entity_resolution.resolver:main"
corpgraph-seed-demo = "corpgraph.seed_demo_data:main"
corpgraph-wikidata = "corpgraph.scrapers.wikidata:main"

[tool.setuptools.packages.find]
include = ["corpgraph*"]

[tool.pytest.ini_options]
addopts = "--cov=corpgraph --cov-report=term-missing --cov-fail-under=80"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["corpgraph"]
