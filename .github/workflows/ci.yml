name: World Money CI & Performance Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  corpgraph_frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: corpgraph/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: corpgraph/frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  corpgraph:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: corpgraph

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: corpgraph/pyproject.toml

      - name: Install CorpGraph
        run: python -m pip install -e '.[dev]'

      - name: Lint CorpGraph
        run: ruff check .

      - name: Type-check CorpGraph
        run: mypy

      - name: Test CorpGraph
        run: pytest

  test_and_build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: npm ci

      - name: Run JavaScript Test Suite
        run: npm test

      - name: Run Python Regression Tests
        run: python3 -m unittest discover tests

      - name: Production Bundle Build
        run: npm run build

      - name: Performance Bundle Budget Gate (<600 KB)
        run: |
          TOTAL_SIZE=$(du -k dist/assets/*.js | awk '{sum+=$1} END {print sum}')
          echo "Total Production JS Assets: ${TOTAL_SIZE} KB"
          if [ "$TOTAL_SIZE" -gt 650 ]; then
            echo "ERROR: Production bundle size budget exceeded 650 KB limit!"
            exit 1
          fi
          echo "✔ Performance Bundle Gate Passed: ${TOTAL_SIZE} KB is within SLA budget."
